<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  <body>
    <!--
      ol 有序标签（Ordered List）   默认显示数字编号
      ul 无序标签（Unordered List） 默认显示项目符号
      li 列表项（List Item）       表示列表中的每一项
    -->
    <!-- 有序 -->
    <ol>
      <li>数据类型</li>
      <li>变量</li>
      <li>流程控制</li>
      <li>函数</li>
      <li>面向对象</li>
    </ol>

    <!-- 无序 -->
    <ul>
      <li>Java</li>
      <li>C</li>
      <li>php</li>
      <li>go</li>
      <li>python</li>
    </ul>

    <!-- 嵌套 -->
    <ul>
      <li>Java
        <ol>
          <li>数据类型</li>
          <li>变量</li>
          <li>流程控制</li>
          <li>函数</li>
          <li>面向对象</li>
        </ol>
      </li>
      <li>C</li>
      <li>php</li>
      <li>go</li>
      <li>python</li>
    </ul>
  </body>
</html>
