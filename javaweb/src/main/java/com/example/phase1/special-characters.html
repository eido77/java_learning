<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  <body>
    <!--
     字符实体（转义）
     【为什么要转义】
       HTML 中 < > & 等符号有特殊含义（标签开头、结尾、实体开头）。
       想在页面上原样显示它们，必须写成字符实体。
     【写法规范】
       以 & 开头，以 ; 结尾，中间是实体名称或 #编号。
       实体名称区分大小写；漏写分号可能导致解析出错。
     【两种写法】
       实体名称：&lt;     易读好记，常用符号优先使用
       实体编号：&#60;    十进制；&#x3C; 是十六进制，没有名称时使用
     【常用实体】
       符号    名称          编号       说明
       <       &lt;        &#60;      小于号
       >       &gt;        &#62;      大于号
       &       &amp;       &#38;      和号
       "       &quot;      &#34;      双引号（属性值中常用）
       '       &apos;      &#39;      单引号（&apos; 是 HTML5 写法，追求兼容可用 &#39;）
       空格    &nbsp;      &#160;     不换行空格（不要用来做排版缩进）
       ¥       &yen;       &#165;     日元 / 人民币符号
    -->
    <h1>一级标题</h1>

    <p>&lt;h1&gt;一级标题&lt;/h1&gt;</p>

    <!--
      &gt; 浏览器会解析成大于号，页面显示 >
      &amp;gt; 浏览器先把 &amp; 解析成 &，后面的 gt; 当作普通文字，页面显示 &gt;
    -->
    &gt;
    <br>
    &amp;gt;
  </body>
</html>
