<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  <body>
    <!--
      标题标签：h1 - h6
      数字越小级别越高、字号越大，默认加粗并独占一行
      一个页面通常只用一个 h1，标题层级不要跳跃
    -->
    <h1>标题1</h1>
    <h2>标题2</h2>
    <h3>标题3</h3>
    <h4>标题4</h4>
    <h5>标题5</h5>
    <h6>标题6</h6>

    <!--
      段落：p
      块级元素，独占一行，段落之间默认有上下间距。
    -->
    <p>
      “我已经老了，有一天，在一处公共场所的大厅里，有一个男人向我走来。
      他主动介绍自己，他对我说：“我认识你，永远记得你。<br>
      那时候，你还很年轻，人人都说你美，现在，我是特为来告诉你，
      对我来说，我觉得现在你比年轻的时候更美，那时你是年轻女人，
      与你那时的面貌相比，我更爱你现在备受摧残的面容。
    </p>

    <!--
      换行：br、hr
      br 是换行标签（break），只在文字中间断行，不显示任何线条，属于行内内容，常用在段落内部。
      hr 是水平分割线（horizontal rule），表示主题上的分隔，会显示一条横线，属于块级元素，自带独占一行，不能放在 p 内部。
    -->
    <br><br><br><br>
    <hr>

    <p>
      这个形象，我是时常想到的，这个形象，只有我一个人能看到，
      这个形象，我却从来不曾说起。它就在那里，在无声无息之中，
      永远使人为之惊叹。在所有的形象之中，只有它让我感到自悦自喜，
      只有在它那里，我才认识自己，感到心醉神迷。”
    </p>
  </body>
</html>
