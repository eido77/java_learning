<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  <body>
    <!--
      img 标签：用于在页面中插入图片，是单标签（没有结束标签）
        src 图片路径（必填），三种写法：
          1. URL（网络地址）
          2. 相对路径：相对于当前 HTML 文件的位置
          3. 绝对路径：以 / 开头的站点根路径
        title  鼠标悬停时显示的提示文字
        alt    图片加载失败时显示的替代文字，同时供屏幕阅读器朗读
        width  图片显示宽度（单位 px，只写数字即可）
        height 图片显示高度（单位 px，只写数字即可）
    -->
    <img src="img/logo.png" width="300" title="尚硅谷" alt="尚硅谷logo">

    <hr>

    <img src="/javacode/javaweb/src/main/java/com/example/phase1/img/logo.png" title="atguigu" alt="">
  </body>
</html>
