<!--
    1.html文件的根标签 <html> </html>
      所有的其他标签都要在这个标签中间
    2.html根标签下有两个一级子标签
      <head> </head> 头标签：定义那些不直接展示在页面主体上，但是又很重要的内容
                            1.字符集 <meta charset="UTF-8"> 告诉浏览器用什么字符集对文件解码
                            2.css引入
                            3.js引入...
      <body> </body> 体标签：定义要展示到页面主体的标签

      <head> 里的内容不显示在页面主体，但 <title> 会显示在浏览器标签页上。
    3.专业词汇
        标签 tag         页面上的一个<>
        属性 attribute   对标签特征进行设置的一种方式，属性一般在开始标签中定义，格式是 属性名="属性值"，多个属性之间用空格隔开
        文本 text        双标签中间的文字
        元素 element     开始标签+属性+文本+结束标签 称之为一个元素
    4.html 更多的语法细节（见 1.8 HTML的语法规则）
-->

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- title：定义浏览器标签页、收藏夹和搜索结果中显示的页面标题，不是文件名；每个页面应有且只有一个。 -->
    <title>第一个页面</title>
  </head>

  <body>
    <!--
        <h1> 是“一级标题”标签（heading，标题），用于表示页面中最重要的标题，浏览器默认以大号加粗字体显示。
        <h1> 到 <h6> 共六级标题：h1 最大最重要，h6 最小最不重要。
    -->
    <h1>Hello World!</h1>

    <!--
        <input> 是"输入控件"标签，用来让用户输入或选择数据（文本框、密码框、单选框等），属于单标签。
        type：属性名，决定这个输入控件是什么类型。
        type="password" 只是不让别人直接看到输入的字符，并不会加密，真实项目需要配合 HTTPS 等手段保证安全。
    -->
    <input type="text">
    <input type="password">
  </body>

</html>
