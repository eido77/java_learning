<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  <body>
    <!--
      超链接标签：a
      用于创建超链接，实现页面跳转或资源访问。
      常用属性：
        href：定义要跳转的目标资源的地址，有三种写法：
          1.完整的 URL：如 https://www.google.com，用于访问外部资源。
          2.相对路径：不以 / 开头，以当前资源所在的文件夹为出发点去找目标资源。
                    可以以 ./ 或 ../ 开头：
                      ./  表示当前资源所在路径，可以省略不写
                      ../ 表示当前资源的上一层路径，需要时必须显式写出
          3.绝对路径：以 / 开头，以网站根路径为固定的出发点，无论当前资源在哪里，查找起点都不变。
        target：定义目标资源的打开方式。
          _self：在当前窗口打开目标资源（默认值）。
          _blank：在新窗口或新标签页打开目标资源。
    -->

    <a href="https://www.google.com" target="_blank">Google</a>

    <!-- 相对路径 -->
    <!-- 相对路径的起点是 "当前这个文件所在的文件夹"，不是它的父文件夹。 -->
    <a href="ordered-unordered-lists.html" target="_blank">ordered-unordered-lists.html</a>
    <a href="pages/test.html" target="_blank">test</a>

    <!-- 绝对路径 -->
    <a href="/javacode/javaweb/src/main/java/com/example/phase1/pages/test.html" target="_blank">test</a>
    <!--
      绝对路径以 / 开头，起点是服务器根 http://localhost:63342/，不是项目根，也不是磁盘根。
      所以下面这个链接拼出的完整地址是：
        http://localhost:63342/javacode/javaweb/src/main/java/com/example/phase1/pages/a/test2.html
    -->
    <a href="/javacode/javaweb/src/main/java/com/example/phase1/pages/a/test2.html" target="_blank">test2</a>
  </body>
</html>
