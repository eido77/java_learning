<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  </head>
  <body>
    <!--
      【表格标签结构】
      table 整张表格
        caption 表格标题（可选，必须是 table 的第一个子元素）
        colgroup 列组（可选，写在 caption 之后、thead 之前）
          col 按列设置样式（可选）
        thead 表头（可选）
          tr 表格中的一行
            th 表头单元格，自带加粗居中效果，语义上表示“标题格”
            td 也可以用，例如二维表格左上角的空格
        tbody 表体（可选，可以有多个）
          tr 表格中的一行
            td 行中的一个普通数据单元格
            th 也可以出现在 tbody 的行首，用作行标题
        tfoot 表尾（可选，写在 tbody 之后）
          tr 表格中的一行
            td 汇总类数据单元格
            th 汇总行的标签格也可以用 th，例如“总人数”

      【常用属性】
        rowspan 单元格纵向合并的行数（含自身，整数）
        colspan 单元格横向合并的列数（含自身，整数）
        scope 用在 th 上，col 表示列标题，row 表示行标题，方便读屏软件识别
        border 表格边框（已过时，推荐用 CSS 的 border 属性）

      【注意事项】
        被 rowspan/colspan 占用的位置，不要再写对应的 td/th
        省略 thead/tbody/tfoot 时，浏览器会自动把 tr 包进隐式的 tbody
        表头 th 建议加 scope="col"（列标题）或 scope="row"（行标题）
        只想要加粗居中效果时，用 CSS 控制，不要用 th 代替 td
    -->

    <!--
      style 是 HTML 的全局属性，不是标签；它写在开始标签的尖括号内。
      它叫“行内样式”，作用是用 CSS 给“这一个标签”设置外观。

      text-align  CSS 属性名，控制元素内部内容的水平对齐
      :           分隔 CSS 属性名和 CSS 属性值
      center      CSS 属性值，表示水平居中（其他常用值：left、right、justify）
      ;           结束一条样式声明
      格式：style="属性名: 属性值; 属性名: 属性值;"
    -->
    <h3 style="text-align: center;">员工技能竞赛表</h3>

    <!--
      width 的值既可以是固定长度（如 400px），也可以是百分比；百分比是相对于“父元素宽度”计算的。
      margin: 0px auto;  外边距。两个值分别表示“上下”和“左右”：上下为 0，左右为 auto（自动平分剩余空间），所以表格水平居中。
      width: 400px;      表格宽度固定为 400 像素；内容太宽时，表格可能被撑开而超过这个宽度。
    -->
    <table border="1px" style="margin: 0px auto; width: 400px;">
      <thead>
        <tr>
          <th>排名</th>
          <th>姓名</th>
          <th>分数</th>
          <th>备注</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>1</td>
          <td>张小明</td>
          <td>100</td>
          <td rowspan="6">前三名升职加薪</td>
        </tr>

        <tr>
          <td>2</td>
          <td>李小黑</td>
          <td>99</td>
        </tr>

        <tr>
          <td>3</td>
          <td>王小东</td>
          <td>98</td>
        </tr>

        <tr>
          <td>总人数</td>
          <td colspan="2">200</td>
        </tr>
        <tr>
          <td>平均分</td>
          <td colspan="2">96</td>
        </tr>
        <tr>
          <td>及格率</td>
          <td colspan="2">80%</td>
        </tr>
      </tbody>

      <tfoot></tfoot>
    </table>
  </body>
</html>
