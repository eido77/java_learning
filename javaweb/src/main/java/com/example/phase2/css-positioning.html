<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      .innerDiv {
        width: 100px;
        height: 100px;
        border: 1px solid blue;
      }

      /*
        【position 取值】
          static    默认值；在正常文档流中；top/right/bottom/left 和 z-index 无效。
                    按正常文档流排列（块级元素垂直排列，行内元素水平排列）
          relative  仍在文档流中，原位置保留（占位）；偏移是相对“自己原本的位置”；
                    常用作 absolute 子元素的定位父级（子绝父相）。
          absolute  脱离文档流，不占位；“绝对”的意思：不看自己原来的位置，直接按 top/right/bottom/left 定位。
                    没有定位祖先（所有祖先都是 static）时，相对初始包含块（页面大小的区域）的对应边： left/top 从左/上边算，right/bottom 从右/下边算；
                    有定位祖先（最近的非 static 祖先）时，改为相对该祖先的对应边；随页面滚动。
          fixed     脱离文档流，不占位；相对浏览器视口定位；页面滚动时位置不变。
          sticky    在文档流中占位；滚动到阈值（如 top: 0）之前表现像 relative，
                    之后像 fixed，常用于吸顶导航、表头；必须写阈值，祖先的 overflow 可能影响效果。

        【relative 时 left / right】
          left: 30px 表示“元素的左边缘，离参照物左边缘 30px”。
          它描述的是“离哪条边多远”，不是“往哪个方向走”。
          relative：参照物是元素自己原本的位置。
            left: 30px  -> 左边缘离原位置左边 30px -> 看起来向右移。
            right: 30px -> 右边缘离原位置右边 30px -> 看起来向左移。
            top / bottom 同理（top: 30px 看起来向下移）。
          absolute / fixed：参照物是包含块（定位祖先 / 视口），
            left: 30px 就是贴着左边留 30px，right: 30px 就是贴着右边留 30px，
            所以它们看起来更“直观”。
          同时写 left 和 right（或 top 和 bottom）：
            relative：left 优先，right 被忽略（从左到右的语言环境）；top 优先于 bottom。
        */
      .d1 {
        background-color: greenyellow;
        position: fixed;
        top: 30px;
        left: 30px;
      }

      .d2 {
        background-color: red;
      }

      .d3 {
        background-color: aqua;
      }
    </style>
  </head>
  <body>
    <div class="innerDiv d1">diva</div>
    <div class="innerDiv d2">divb</div>
    <div class="innerDiv d3">divc</div>
  </body>
</html>
