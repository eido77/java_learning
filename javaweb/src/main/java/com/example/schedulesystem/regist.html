<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      .ht {
        text-align: center;
        color: cadetblue;
        font-family: 幼圆;
      }

      .tab {
        width: 500px;
        border: 5px solid cadetblue;
        margin: 0px auto;
        border-radius: 5px;
        font-family: 幼圆;
      }

      .ltr td {
        border: 1px solid powderblue;
      }

      .ipt {
        border: 0px;
        width: 50%;
      }

      .btn1 {
        border: 2px solid powderblue;
        border-radius: 4px;
        width: 60px;
        background-color: antiquewhite;
      }

      .msg {
        color: gold;
      }

      .buttonContainer {
        text-align: center;
      }
    </style>
    <script>
      function checkUsername() {
        const usernameReg = /^[a-zA-Z0-9]{5,10}$/;
        const usernameInput = document.getElementById('usernameInput');
        const username = usernameInput.value;
        const usernameMsg = document.getElementById('usernameMsg');
        if (!usernameReg.test(username)) {
          usernameMsg.innerText = '格式有误';
          return false;
        }
        usernameMsg.innerText = 'OK';
        return true;
      }

      function checkUserPwd() {
        const userPwdReg = /^\d{6}$/;
        const userPwdInput = document.getElementById('userPwdInput');
        const userPwd = userPwdInput.value;
        const userPwdMsg = document.getElementById('userPwdMsg');
        if (!userPwdReg.test(userPwd)) {
          userPwdMsg.innerText = '格式有误';
          return false;
        }
        userPwdMsg.innerText = 'OK';
        return true;
      }

      function checkReUserPwd() {
        const userPwdReg = /^\d{6}$/;
        // 再次输入的密码的格式
        const reUserPwdInput = document.getElementById('reUserPwdInput');
        const reUserPwd = reUserPwdInput.value;
        const reUserPwdMsg = document.getElementById('reUserPwdMsg');
        if (!userPwdReg.test(reUserPwd)) {
          reUserPwdMsg.innerText = '格式有误';
          return false;
        }
        // 获得上次密码,对比两次密码是否一致
        const userPwdInput = document.getElementById('userPwdInput');
        const userPwd = userPwdInput.value;
        if (reUserPwd != userPwd) {
          reUserPwdMsg.innerText = '两次密码不一致';
          return false;
        }
        reUserPwdMsg.innerText = 'OK';
        return true;
      }

      function checkForm() {
        const flag1 = checkUsername();
        const flag2 = checkUserPwd();
        const flag3 = checkReUserPwd();

        return flag1 && flag2 && flag3;
      }
    </script>
  </head>
  <body>
    <h1 class="ht">欢迎使用日程管理系统</h1>
    <h3 class="ht">请注册</h3>
    <form method="post" action="/user/regist" onsubmit="return checkForm()">
      <table class="tab" cellspacing="0px">
        <tr class="ltr">
          <td>请输入账号</td>
          <td>
            <input class="ipt" id="usernameInput" type="text" name="username" onblur="checkUsername()">
            <span id="usernameMsg" class="msg"></span>
          </td>
        </tr>
        <tr class="ltr">
          <td>请输入密码</td>
          <td>
            <input class="ipt" id="userPwdInput" type="password" name="userPwd" onblur="checkUserPwd()">
            <span id="userPwdMsg" class="msg"></span>
          </td>
        </tr>
        <tr class="ltr">
          <td>确认密码</td>
          <td>
            <input class="ipt" id="reUserPwdInput" type="password" onblur="checkReUserPwd()">
            <span id="reUserPwdMsg" class="msg"></span>
          </td>
        </tr>
        <tr class="ltr">
          <td colspan="2" class="buttonContainer">
            <input class="btn1" type="submit" value="注册">
            <input class="btn1" type="reset" value="重置">
            <a class="btn1" href="login.html">去登录</a>
          </td>
        </tr>
      </table>
    </form>
  </body>
</html>
