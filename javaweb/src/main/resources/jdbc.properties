# 【键名】以 dev.atguigu.url 为例：
# dev = 环境前缀；atguigu = 项目（或库）名前缀；url = 具体配置项。

# ==================== 开发环境 dev ====================
# 【url：数据库连接地址】格式：jdbc:mysql://主机:端口/数据库名
#   jdbc:mysql:  → 协议，表示用 JDBC 连接 MySQL
#   localhost    → 主机，表示本机（数据库装在自己电脑上）
#   3306         → MySQL 的默认端口号
#   atguigu      → 要连接的数据库名，需要提前在 MySQL 里创建好
dev.atguigu.url=jdbc:mysql://localhost:3306/atguigu
# 【driver：驱动类的全类名】告诉 Java 用哪个类去连接 MySQL。
dev.atguigu.driver=com.mysql.cj.jdbc.Driver
dev.atguigu.username=root
dev.atguigu.password=
# ==================== 测试环境 test ====================
test.atguigu.url=jdbc:mysql://localhost:3306/atguigu
test.atguigu.driver=com.mysql.cj.jdbc.Driver
test.atguigu.username=zhangsan
test.atguigu.password=123456
